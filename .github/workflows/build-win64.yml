name: Build OpenResty for Windows x64

on:
  workflow_dispatch:  # 手动触发
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-perl
            mingw-w64-x86_64-make
            make
            perl
            perl-podlators
            git
            wget
            dos2unix
            zip
            unzip
            patch

      - name: Prepare bundle (download dependencies)
        env:
          LANG: C
          LC_ALL: C
          SKIP_RESTYDOC: 1
        run: |
          make

      - name: Build OpenResty
        working-directory: openresty-1.31.1.1
        run: |
          bash ../util/build-win32.sh

      - name: Package
        working-directory: openresty-1.31.1.1
        run: |
          bash ../util/package-win32.sh || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openresty-windows-x64
          path: openresty-1.31.1.1/openresty-*-win64.zip
